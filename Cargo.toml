[package]
name = "ninep-server"
version = "1.0.0"
edition = "2021"
description = "9P.e Server - Refactored with clean architecture"
license = "AGPL-3.0-or-later"
repository = "https://github.com/kiljoy001/9pe-server"
keywords = ["9p", "filesystem", "quic", "protocol", "server"]
categories = ["network-programming", "filesystem"]
authors = ["9PE Team"]

[lib]
name = "ninep_server"
path = "src/lib.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }

# CLI framework
clap = { version = "4.0", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async utilities
async-trait = "0.1"

# QUIC transport support
quinn = "0.10"
rustls = "0.21"
webpki-roots = "0.26"
rcgen = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Network utilities
if-addrs = "0.10"

# System interface
libc = "0.2"

# Local 9P.e protocol implementation
ninepee = { path = "../9PE" }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Configuration
directories = "5.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# WASM support for translators
wasmtime = "27.0"
wasmtime-wasi = "27.0"
wasm-encoder = "0.38"
wasmparser = "0.118"

# Additional dependencies for translator system
futures = "0.3"
regex = "1.10"
once_cell = "1.19"
toml = "0.8"
bincode = "1.3"
rand = "0.8"

# Authentication
argon2 = "0.5"

# FUSE filesystem support for mounting
fuser = "0.14"

# Hex encoding
hex = "0.4"

# Pattern matching
lazy_static = "1.4"

# OpenCL support for compute host functions
opencl3 = "0.9"

# Additional dependencies for consensus
num_cpus = "1.16"
reqwest = { version = "0.12.23", features = ["json"] }
sha2 = "0.10.9"

[dev-dependencies]
# Testing
tokio-test = "0.4"
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

# Test utilities
rand = "0.8"
toml = "0.8"
async-trait = "0.1"

[features]
default = []
testing = []

[[bin]]
name = "ninep-server"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 2
