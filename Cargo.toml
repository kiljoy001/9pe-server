[package]
name = "ninep-server"
version = "1.0.0"
edition = "2021"
description = "9P.e Server - Refactored with clean architecture"
license = "AGPL-3.0-or-later"
repository = "https://github.com/kiljoy001/9pe-server"
keywords = ["9p", "filesystem", "quic", "protocol", "server"]
categories = ["network-programming", "filesystem"]
authors = ["9PE Team"]

[lib]
name = "ninep_server"
path = "src/lib.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }

# CLI framework
clap = { version = "4.0", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async utilities
async-trait = "0.1"

# QUIC transport support
quinn = "0.10"
rustls = "0.21"
webpki-roots = "0.26"
rcgen = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Network utilities
if-addrs = "0.10"

# System interface
libc = "0.2"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Configuration
directories = "5.0"

# Date/time handling
chrono = "0.4"

[dev-dependencies]
# Testing
tokio-test = "0.4"
tempfile = "3.0"

# Property-based testing
proptest = "1.0"

# Test utilities
rand = "0.8"

[features]
default = []
testing = []

[[bin]]
name = "ninep-server"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 2