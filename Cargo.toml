[package]
name = "plan9e-server"
version = "1.0.0"
edition = "2021"
description = "9P.e Server - Modern filesystem protocol server with QUIC transport"
license = "AGPL-3.0-or-later"
repository = "https://github.com/kiljoy001/9pe-server"
keywords = ["9p", "filesystem", "quic", "protocol", "server"]
categories = ["network-programming", "filesystem"]
authors = ["9PE Team"]

[dependencies]
# 9PE core protocol
plan9e = { path = "../9PE", package = "ninepee" }

# Core async runtime
tokio = { version = "1.0", features = ["full"] }

# CLI framework
clap = { version = "4.0", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
anyhow = "1.0"

# FUSE filesystem support
fuser = "0.14"

# FUSE mounting (additional)
# Note: fuse3 provides better performance but fuser is more stable

# Async utilities
futures = "0.3"
async-trait = "0.1"

# System interface
libc = "0.2"

# P2P networking and discovery
libp2p = { version = "0.52", features = ["kad", "mdns", "noise", "tcp", "gossipsub", "identify", "autonat", "relay", "dcutr", "macros", "yamux", "tokio"] }

# Network interface detection
if-addrs = "0.10"

# User information
whoami = "1.4"

# Date/time handling
chrono = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Random for fuzzing and ID generation
rand = "0.8"

# WASM and function file support via features

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Hex encoding
hex = "0.4"

# Metrics and monitoring
prometheus = "0.13"
lazy_static = "1.4"
sys-info = "0.9"

# QUIC transport support
quinn = "0.10"
rustls = "0.22"
webpki-roots = "0.26"

# Web API dependencies
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Cryptography for auth
ed25519-dalek = "2.0"
sha2 = "0.10"
base64 = "0.21"

# HTTP client for translators
reqwest = { version = "0.11", features = ["json"] }

# WASM support (optional)
wasmtime = { version = "27.0", optional = true }
wasmtime-wasi = { version = "27.0", optional = true }
wasm-encoder = { version = "0.38", optional = true }
wasmparser = { version = "0.118", optional = true }

# Native window support
wry = { version = "0.46", optional = true }

# GTK4 native UI (alternative to wry)
gtk4 = { version = "0.9", optional = true }
cairo-rs = { version = "0.20", features = ["use_glib"], optional = true }
glib = { version = "0.20", optional = true }
sysinfo = { version = "0.31", optional = true }

# Optional fuzzing dependencies (moved to main dependencies as optional)
afl = { version = "0.15", optional = true }
libfuzzer-sys = { version = "0.4", optional = true }
honggfuzz = { version = "0.5", optional = true }
arbitrary = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
# Testing
tokio-test = "0.4"
tempfile = "3.0"

# Property-based testing
proptest = "1.0"
quickcheck = "1.0"
quickcheck_macros = "1.0"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Test utilities
rand = "0.8"
uuid = { version = "1.0", features = ["v4"] }

[features]
default = []
testing = []
advanced = []  # Enables synthetic files, translators, auth
wasm = ["wasmtime", "wasmtime-wasi", "wasm-encoder", "wasmparser"]
grid = []
native = ["wry"]  # Native window support
gtk = ["gtk4", "cairo-rs", "glib", "sysinfo"]  # GTK4 native window support with monitoring
fuzz-afl = ["afl"]
fuzz-libfuzzer = ["libfuzzer-sys", "arbitrary"]
fuzz-honggfuzz = ["honggfuzz"]

[[bin]]
name = "9pe-server"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 2
