# 9P.e Server Config
#
# This config controls the core server behavior. LLM integration
# is done via WASM translators, not the server itself.

[server]
listen_addr = "0.0.0.0:5640"
node_id = "intel-arc-node"
dht_bootstrap_peers = ["192.168.1.117:9650"]

[consensus]
enabled = false
# Optional bootstrap peers for DHT seeding (not required - DHT will auto-discover)
# peers = ["rentonsoftworks.coin:9650"]
# peers = ["rentonsoftworks.coin:9650"]  # Empty - auto-discovery via DHT

# GPU and LLM config is for WASM translators to query capabilities
# The server itself doesn't use LLMs - that's done in translators

[gpu]
enabled = true
backend = "sycl"  # Default SYCL backend (AdaptiveCpp)
device_id = 0

[llama]
# This tells translators that LLM is available on this node
enabled = true
server_url = "http://localhost:8080"  # For translators to use

[logging]
level = "info"
