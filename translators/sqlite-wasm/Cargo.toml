[package]
name = "sqlite-wasm-translator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.4"

# SQLite WASM (we'll use sql.js via JS bindings)
web-sys = { version = "0.3", features = [
  "console",
] }

[dependencies.rusqlite]
version = "0.29"
features = ["bundled"]
optional = true

[features]
default = []
native = ["rusqlite"]